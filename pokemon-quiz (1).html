<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teste de Personalidade Pokémon</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Nunito',sans-serif;background:#f8f7ff;min-height:100vh;display:flex;justify-content:center;padding:2rem 1rem 4rem;color:#1a1a2e}
    #quiz-root{width:100%;max-width:640px}
    .quiz-header{text-align:center;margin-bottom:2rem}
    .quiz-header h1{font-size:24px;font-weight:800;color:#1a1a2e;margin-bottom:6px}
    .quiz-header p{font-size:13px;color:#6b7280}
    .progress-bar-wrap{background:#e5e7eb;border-radius:99px;height:6px;margin-bottom:1.5rem}
    .progress-bar-fill{height:6px;border-radius:99px;background:linear-gradient(90deg,#f5a623,#e84c4c);transition:width .4s ease}
    .scroll-hint{font-size:11px;color:#9ca3af;text-align:center;margin-bottom:10px}
    .question-card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:1.25rem 1.25rem 1rem;margin-bottom:1rem;box-shadow:0 1px 4px rgba(0,0,0,.05)}
    .question-num{font-size:11px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
    .question-text{font-size:14px;font-weight:600;color:#1a1a2e;line-height:1.55;margin-bottom:1rem}
    .options{display:flex;flex-direction:column;gap:6px}
    .opt-btn{display:flex;align-items:center;gap:10px;background:#f3f4f6;border:1.5px solid transparent;border-radius:10px;padding:9px 14px;cursor:pointer;font-family:'Nunito',sans-serif;font-size:13px;font-weight:600;color:#374151;text-align:left;transition:all .15s}
    .opt-btn:hover{background:#e9eaf0;border-color:#d1d5db}
    .opt-btn.selected{border-color:#e84c4c;background:#fff1f1;color:#c0392b}
    .opt-dot{width:16px;height:16px;border-radius:50%;border:1.5px solid #d1d5db;flex-shrink:0;transition:all .15s;display:flex;align-items:center;justify-content:center}
    .opt-btn.selected .opt-dot{background:#e84c4c;border-color:#e84c4c}
    .dot-inner{width:6px;height:6px;border-radius:50%;background:white;display:none}
    .opt-btn.selected .dot-inner{display:block}
    .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:1.25rem}
    .counter{font-size:12px;color:#9ca3af;font-weight:600}
    .nav-btn{padding:10px 24px;border-radius:10px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;cursor:pointer;border:1.5px solid #d1d5db;background:#fff;color:#374151;transition:all .15s}
    .nav-btn.primary{background:#e84c4c;border-color:#e84c4c;color:white}
    .nav-btn.primary:hover{background:#c0392b;border-color:#c0392b}
    .nav-btn:disabled{opacity:.35;cursor:default}
    .all-answered-note{font-size:12px;color:#e84c4c;text-align:center;font-weight:600;margin-top:8px}
    .result-card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:2rem 1.5rem;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.07)}
    .result-img{width:160px;height:160px;object-fit:contain;margin:0 auto 1rem;display:block}
    .result-score-badge{display:inline-block;background:#fff1f1;color:#c0392b;font-size:12px;font-weight:800;border-radius:99px;padding:4px 14px;margin-bottom:1rem}
    .result-type{font-size:24px;font-weight:800;color:#1a1a2e;margin-bottom:8px}
    .result-desc{font-size:13px;color:#6b7280;line-height:1.65;margin-bottom:1.25rem}
    .trait-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1.25rem}
    .trait-pill{background:#f3f4f6;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:600;color:#374151;display:flex;align-items:center;gap:6px}
    .trait-dot{width:7px;height:7px;border-radius:50%;background:#e84c4c;flex-shrink:0}
    .need-box{background:#fff8e6;border-radius:10px;border:1px solid #f5c842;padding:10px 14px;margin-bottom:1.25rem}
    .need-label{font-size:11px;font-weight:800;color:#b07e00;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
    .need-text{font-size:13px;font-weight:600;color:#7a5800}
    .hidden-section{margin-top:1rem;border-top:1px solid #f3f4f6;padding-top:1rem}
    .hidden-title{font-size:11px;font-weight:800;color:#9ca3af;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
    .hidden-pill{display:inline-block;background:#f3f4f6;border-radius:99px;padding:4px 12px;font-size:12px;font-weight:700;color:#374151;margin:3px}
    .restart-btn{margin-top:1.5rem;padding:11px 32px;border-radius:10px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;cursor:pointer;background:#e84c4c;border:none;color:white;transition:background .15s}
    .restart-btn:hover{background:#c0392b}
    @media(max-width:480px){.trait-grid{grid-template-columns:1fr}.quiz-header h1{font-size:20px}}
  </style>
</head>

  "Em momentos de alta pressão ou após derrotas, você já sentiu vontade de abandonar temporariamente a jornada ou se afastar do mundo das batalhas.",
  "Você considera que sua sensibilidade emocional (em relação a pessoas e Pokémon) é mais forte do que a da maioria."
];

const opts = ["Concordo totalmente","Concordo parcialmente","Não tenho certeza","Discordo parcialmente","Discordo totalmente"];
const scrs = [4,3,2,1,0];
const MAX = 56;

// Ranges scaled to 14 questions (max 56 pts)
// 0-14 | 15-28 | 29-42 | 43-56
const types = [
  {range:[0,14],name:"Tipo Misdreavus",img:IMGS[0],
    desc:"Você possui uma personalidade altamente sensível e com baixa energia. É muito sensível a mudanças nas emoções, nos relacionamentos e no ambiente. Lembra silenciosamente de muitos pequenos detalhes que os outros ignoram.",
    traits:["Propenso à exaustão mental","Prefere a solidão","Recuperação emocional mais lenta","Costuma pensar demais"],
    need:"Não é se forçar a ser positivo, mas sim restaurar sua energia mental."},
  {range:[15,28],name:"Tipo Eevee",img:IMGS[1],
    desc:"Você tem uma personalidade gentil e empática. É altamente adaptável e bom em cuidar dos outros, mas frequentemente negligencia suas próprias necessidades. Busca sempre relacionamentos harmoniosos.",
    traits:["Cuida muito dos sentimentos dos outros","Facilmente influenciado pela atmosfera","Precisa de segurança interior","Não gosta de conflitos"],
    need:"Aprender a se colocar em primeiro lugar."},
  {range:[29,42],name:"Tipo Pikachu",img:IMGS[2],
    desc:"Seu estado mental geral é relativamente estável. Você sente ansiedade e tristeza, mas se recupera rapidamente e não costuma ter períodos prolongados de mau humor. Você pertence ao tipo fluxo de energia.",
    traits:["Altamente motivado(a)","Recuperação mental rápida","Altamente adaptável","Boa resiliência emocional"],
    need:"Manter seu próprio ritmo e não deixar que fatores externos o(a) drenem demais."},
  {range:[43,56],name:"Tipo Charizard",img:IMGS[3],
    desc:"Você é um típico tipo de crescimento sob alta pressão. Outros podem vê-lo(a) como muito capaz e resiliente, mas você raramente se permite descansar de verdade. Está acostumado(a) a resolver problemas enfrentando-os com força.",
    traits:["Forte autoestima","Aversão a demonstrar fraqueza","Forte senso de responsabilidade","Vive em estado de tensão constante"],
    need:"Permita-se ser vulnerável ocasionalmente, em vez de sempre ser forte."}
];

// Hidden traits mapped to new 0-indexed question numbers
const hiddenTraits = [
  {qs:[1,9,11],label:"Personalidade Altamente Sensível"},
  {qs:[0,8],   label:"Personalidade Orientada para a Ação"},
  {qs:[6,11],  label:"Personalidade Ansiosa e Pensante"},
  {qs:[7],     label:"Personalidade Introvertida e Restauradora"},
  {qs:[12],    label:"Personalidade que Evita o Estresse"}
];

const TOTAL_Q = 14;
let answers = new Array(TOTAL_Q).fill(null);
let showingResult = false;

function render() {
  const body = document.getElementById('quiz-body');
  if (showingResult) { renderResult(body); return; }
  const answered = answers.filter(a => a !== null).length;
  const prog = (answered / TOTAL_Q) * 100;
  let html = `<div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${prog}%"></div></div>`;
  html += `<p class="scroll-hint">Role para ver todas as perguntas</p>`;
  questions.forEach((q, i) => {
    const sel = answers[i];
    html += `<div class="question-card">
      <div class="question-num">Pergunta ${i+1} de ${TOTAL_Q}</div>
      <div class="question-text">${q}</div>
      <div class="options">`;
    opts.forEach((o, j) => {
      const s = sel === j ? ' selected' : '';
      html += `<button class="opt-btn${s}" onclick="choose(${i},${j})">
        <span class="opt-dot"><span class="dot-inner"></span></span>${o}
      </button>`;
    });
    html += `</div></div>`;
  });
  const allDone = answered === TOTAL_Q;
  html += `<div class="nav-row">
    <span class="counter">${answered}/${TOTAL_Q} respondidas</span>
    <button class="nav-btn primary" ${allDone ? '' : 'disabled'} onclick="showResult()">Ver resultado →</button>
  </div>`;
  if (!allDone) html += `<p class="all-answered-note">Responda todas as perguntas para ver seu resultado</p>`;
  body.innerHTML = html;
}

function choose(qi, oi) { answers[qi] = oi; render(); }
function showResult() { showingResult = true; render(); }

function renderResult(body) {
  const total = answers.reduce((s, a) => s + (a !== null ? scrs[a] : 0), 0);
  const type = types.find(t => total >= t.range[0] && total <= t.range[1]) || types[3];
  const hidden = hiddenTraits.filter(ht => {
    const avg = ht.qs.reduce((s, q) => s + (answers[q] !== null ? scrs[answers[q]] : 0), 0) / ht.qs.length;
    return avg >= 3;
  });
  let hiddenHtml = '';
  if (hidden.length > 0) {
    hiddenHtml = `<div class="hidden-section">
      <div class="hidden-title">Tendências ocultas detectadas</div>
      ${hidden.map(h => `<span class="hidden-pill">✦ ${h.label}</span>`).join('')}
    </div>`;
  }
  body.innerHTML = `<div class="result-card">
    <div class="result-score-badge">Pontuação: ${total} / ${MAX}</div>
    <img src="${type.img}" class="result-img" alt="${type.name}" />
    <div class="result-type">${type.name}</div>
    <div class="result-desc">${type.desc}</div>
    <div class="trait-grid">${type.traits.map(t => `<div class="trait-pill"><span class="trait-dot"></span>${t}</div>`).join('')}</div>
    <div class="need-box">
      <div class="need-label">O que você mais precisa agora</div>
      <div class="need-text">${type.need}</div>
    </div>
    ${hiddenHtml}
    <button class="restart-btn" onclick="restart()">Refazer o teste</button>
  </div>`;
}

function restart() {
  answers = new Array(TOTAL_Q).fill(null);
  showingResult = false;
  render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

render();
</script>
</body>
</html>
